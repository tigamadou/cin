# CIN Event Management System - Production Configuration
# =====================================================

version: "3.8"

services:
  cin-db:
    image: mysql:8.0
    container_name: cin-db-prod
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      # Init script creates user with '%' host for Docker network access
      - ./mysql/init-grant-user.sh:/docker-entrypoint-initdb.d/01-grant-user.sh:ro
    restart: unless-stopped
    networks:
      - cin-network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # Production: pas d'exposition de port direct
    # ports:
    #   - "3306:3306"

  cin-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cin-api-prod
    command: gunicorn project.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    environment:
      - DATABASE_URL=mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@cin-db-prod:3306/${MYSQL_DATABASE}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=cin2025.bj,www.cin2025.bj,panel.cin2025.bj,www.panel.cin2025.bj,api.cin2025.bj,www.api.cin2025.bj
      - CSRF_TRUSTED_ORIGINS=https://cin2025.bj,https://www.cin2025.bj,https://panel.cin2025.bj,https://api.cin2025.bj,https://www.api.cin2025.bj
      - CORS_ALLOWED_ORIGINS=https://cin2025.bj,https://www.cin2025.bj,https://panel.cin2025.bj,https://api.cin2025.bj,https://www.api.cin2025.bj
      - CSRF_COOKIE_DOMAIN=${CSRF_COOKIE_DOMAIN:-.cin2025.bj}
      - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN:-.cin2025.bj}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - APP_DOMAIN=https://cin2025.bj
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL}
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      - cin-db
    restart: unless-stopped
    networks:
      - cin-network
    # Production: health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  cin-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${API_DOMAIN:-}
    container_name: cin-frontend-prod
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=${API_DOMAIN:-}
    depends_on:
      - cin-api
    restart: unless-stopped
    networks:
      - cin-network

  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   networks:
  #     - cin-network
  #   # Production: configuration Redis
  #   command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
  #   volumes:
  #     - redis_data:/data

  cin-phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: cin-phpmyadmin-prod
    environment:
      PMA_HOST: cin-db-prod
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - cin-db
    restart: unless-stopped
    networks:
      - cin-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  cin-network:
    driver: bridge
